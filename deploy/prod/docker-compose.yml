# Stack produksi: hanya menarik image dari GHCR, tanpa build di server.
# Salin folder ini ke server (mis. /opt/skillbridge), salin .env.example menjadi .env, isi kredensial.
# Detail: docs/DEPLOY.md
name: skillbridge

x-app: &app
  image: ghcr.io/ar-elfahmi/skillbridge-api:${IMAGE_TAG:?isi IMAGE_TAG di .env}
  restart: unless-stopped
  env_file: .env
  networks: [internal]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - pdf-storage:/var/www/html/storage/app/private

services:
  web:
    image: ghcr.io/ar-elfahmi/skillbridge-web:${IMAGE_TAG:?isi IMAGE_TAG di .env}
    restart: unless-stopped
    networks: [internal]
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      - app
    mem_limit: 64m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    <<: *app
    mem_limit: 384m
    cpus: 1.0

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--max-time=3600", "--memory=160"]
    mem_limit: 256m
    cpus: 1.0

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_DB: ${DB_DATABASE:?}
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "effective_cache_size=384MB", "-c", "work_mem=4MB", "-c", "max_connections=30"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]
    # noeviction: antrean job tidak boleh dibuang saat memori penuh.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?}"]
    volumes:
      - redisdata:/data
    mem_limit: 160m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

networks:
  internal:

volumes:
  pgdata:
  redisdata:
  pdf-storage:
